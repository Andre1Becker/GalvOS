<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="12" fill="#000000" stroke="#30363d" stroke-width="1"/>

  <text x="128" y="26" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="13" font-weight="600" fill="#e6edf3">Corner Dwell</text>

  <!-- pattern edge (undrawn reference line) -->
  <path id="edge" pathLength="100" d="M 48 200 L 150 200 L 150 60"
        fill="none" stroke="#484f58" stroke-width="4" stroke-linecap="round"/>

  <!-- progressively "drawn" overlay, in sync with the beam -->
  <path pathLength="100" d="M 48 200 L 150 200 L 150 60"
        fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset"
              values="100;60;50;40;0" keyTimes="0;0.35;0.5;0.65;1"
              dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- vertices -->
  <circle cx="48" cy="200" r="4" fill="#8b949e"/>
  <circle cx="150" cy="60" r="4" fill="#8b949e"/>

  <!-- extra dwell points, fading in only while the beam lingers at the corner -->
  <g fill="#ffab40">
    <circle cx="134" cy="200" r="3"/>
    <circle cx="142" cy="200" r="3"/>
    <circle cx="150" cy="192" r="3"/>
    <circle cx="150" cy="184" r="3"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0"
              keyTimes="0;0.3;0.35;0.65;0.7;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- corner emphasis ring -->
  <circle cx="150" cy="200" r="9" fill="none" stroke="#ffab40" stroke-width="2">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
              keyTimes="0;0.3;0.35;0.65;0.7;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- the beam, slowing to a near-stop at the corner, then continuing -->
  <circle r="6" fill="#ff6b6b">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
                    keyPoints="0;0.4;0.5;0.6;1" keyTimes="0;0.35;0.5;0.65;1">
      <mpath href="#edge"/>
    </animateMotion>
  </circle>

  <text x="128" y="238" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11" fill="#8b949e">beam slows to add corner points</text>
</svg>
