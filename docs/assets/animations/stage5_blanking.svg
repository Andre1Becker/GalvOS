<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="12" fill="#000000" stroke="#30363d" stroke-width="1"/>

  <text x="128" y="26" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="13" font-weight="600" fill="#e6edf3">Blanking</text>

  <!-- stub of the shape being left -->
  <path pathLength="100" d="M14,190 L50,190" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round"/>

  <!-- the blank jump trajectory (laser off) -->
  <path id="blank" d="M50,190 Q128,80 206,90" fill="none" stroke="#484f58" stroke-width="3" stroke-dasharray="5 5"/>

  <!-- settle emphasis ring at the landing point -->
  <circle cx="206" cy="90" r="9" fill="none" stroke="#ffab40" stroke-width="2">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.8;0.88;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- stub of the next shape, revealed only after settling -->
  <path pathLength="100" d="M206,90 L246,64" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" values="100;100;0;0;100" keyTimes="0;0.5;0.7;0.9;1" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- the beam: laser OFF (red) during the eased blank jump, then settles -->
  <circle r="6" fill="#ff6b6b">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
                    keyPoints="0;0.15;0.6;1;1;1" keyTimes="0;0.15;0.35;0.5;0.9;1">
      <mpath href="#blank"/>
    </animateMotion>
  </circle>

  <text x="128" y="238" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11" fill="#8b949e">S-curve ease, then settle ticks</text>
</svg>
