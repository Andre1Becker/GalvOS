<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="12" fill="#000000" stroke="#30363d" stroke-width="1"/>

  <text x="128" y="26" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="13" font-weight="600" fill="#e6edf3">Frame Budget</text>

  <!-- track -->
  <rect x="40" y="130" width="176" height="20" rx="4" fill="none" stroke="#484f58" stroke-width="3"/>

  <!-- ceiling marker -->
  <line x1="176" y1="118" x2="176" y2="162" stroke="#ffab40" stroke-width="3"/>
  <text x="176" y="112" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="10" fill="#ffab40">max_pts_per_frame</text>

  <!-- fill bar, growing to the ceiling then clamping (not overflowing) -->
  <rect x="42" y="132" height="16" rx="3" fill="#3fb950">
    <animate attributeName="width" values="0;134;134;0" keyTimes="0;0.4;0.75;1" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="128" y="238" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11" fill="#8b949e">interior density scales down to fit</text>
</svg>
