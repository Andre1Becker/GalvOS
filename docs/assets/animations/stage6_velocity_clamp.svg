<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="12" fill="#000000" stroke="#30363d" stroke-width="1"/>

  <text x="128" y="26" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="13" font-weight="600" fill="#e6edf3">Velocity Clamp</text>

  <line x1="40" y1="140" x2="216" y2="140" stroke="#3fb950" stroke-width="5" stroke-linecap="round"/>

  <!-- subdivision ticks + points, appearing once the step is judged too long -->
  <g>
    <g stroke="#ffab40" stroke-width="4">
      <line x1="98.7" y1="128" x2="98.7" y2="152"/>
      <line x1="157.3" y1="128" x2="157.3" y2="152"/>
    </g>
    <g fill="#ffab40">
      <circle cx="98.7" cy="140" r="5"/>
      <circle cx="157.3" cy="140" r="5"/>
    </g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.35;0.45;0.8;0.9;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <text x="128" y="212" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#8b949e">
    one step &gt; max_step_units
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.45;0.85;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="128" y="212" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#8b949e">
    split into three, in budget
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.45;0.85;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="128" y="238" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11" fill="#8b949e">long lit steps get subdivided</text>
</svg>
