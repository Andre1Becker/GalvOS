<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="12" fill="#000000" stroke="#30363d" stroke-width="1"/>

  <text x="128" y="26" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="13" font-weight="600" fill="#e6edf3">Transform</text>

  <!-- original, untransformed shape (identity) -->
  <path d="M128,90 L84.7,165 L171.3,165 Z"
        fill="none" stroke="#484f58" stroke-width="4" stroke-linejoin="round"/>

  <!-- transformed copy: one affine matrix (rotate + scale + translate) -->
  <g transform="translate(128,140)">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                        from="0" to="360" dur="4s" repeatCount="indefinite" additive="sum"/>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="scale"
                          values="1;1.15;0.85;1" keyTimes="0;0.33;0.66;1"
                          dur="4s" repeatCount="indefinite"/>
      <path d="M0,-50 L-43.3,25 L43.3,25 Z"
            fill="none" stroke="#3fb950" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="128" y="238" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif"
        font-size="11" fill="#8b949e">rotate · scale · translate — one matrix</text>
</svg>
