; PlatformIO Project Configuration
; Target: galvOS - a OEM RGB Laser Replacement Mainboard
; Author: Andre

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 variant: 16 MB Flash + 8 MB PSRAM ---
board_build.flash_size = 16MB
board_build.psram_type = octal
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D LASER_FW_VERSION=\"6.51.0\"
    -D GALVO_SAMPLE_RATE_HZ=30000
    -D DEFAULT_DMX_UNIVERSE=0
    -D DEFAULT_DMX_ADDRESS=1
    ; Async-Server-Flags
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_USE_WDT=0

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600
upload_flags = --after=no_reset

; --- Combined flash: firmware + LittleFS in one step ---
; Usage:  pio run --target upload_all
extra_scripts =
    pre:scripts/upload_all.py
    pre:scripts/gzip_assets.py

lib_deps =
    ArduinoOTA
    SD
    ; --- HTTP + WebSocket ---
    esp32async/AsyncTCP@^3.4.10
    esp32async/ESPAsyncWebServer@^3.11.1
    ; --- DMX + Art-Net ---
    someweisguy/esp_dmx@^4.1.0
    https://github.com/rstephan/ArtnetWifi.git
    ; --- JSON ---
    bblanchon/ArduinoJson@^7.0.4
    ; --- Temperature (DS18B20) ---
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

; Build & upload commands:
;   pio run                          -> build firmware
;   pio run --target upload          -> flash firmware only
;   pio run --target uploadfs        -> flash LittleFS only (HTML/CSS/JS from data/)
;   pio run --target buildfs         -> build LittleFS image (without flashing)
;   pio run --target upload_all      -> *** RECOMMENDED: build + flash both ***
;   pio device monitor               -> serial console
; ============================================================================
; Append this block to platformio.ini.
; It adds a host (native) build used ONLY for the optimizer Contract tests.
; It does not touch the ESP32-S3 env above.
;
;   pio test -e native            -> run Contract/invariant tests on the PC
;   pio run  -e native            -> just compile the host target
;
; Requires the Unity test framework (bundled with PlatformIO, no install) and
; a host GCC on PATH -- platform-native drops any other CC/CXX and calls
; env.Tool("gcc") unconditionally, so MSVC will not do. On this machine:
;   winget install -e --id BrechtSanders.WinLibs.POSIX.UCRT
;   PATH += %LOCALAPPDATA%\Microsoft\WinGet\Packages\
;           BrechtSanders.WinLibs.POSIX.UCRT_*\mingw64\bin
; GNU ld is also what provides the --wrap support the allocator probe needs.
; ============================================================================

[env:native]
platform = native
test_framework = unity
; Contract tests link against the real optimizer translation unit, so the
; project sources must be part of the test build (off by default).
test_build_src = yes
build_flags =
    -std=gnu++17
    -D GALVOS_HOST_TEST=1
    -D LASER_FW_VERSION=\"host\"
    -D GALVO_SAMPLE_RATE_HZ=30000
    -D DEFAULT_DMX_UNIVERSE=0
    -D DEFAULT_DMX_ADDRESS=1
    ; Switches on the Contract assertions gated in test/test_optimizer/
    ; contract_features.h. It must come from here rather than from
    ; point_optimizer.h: test_contract.cpp includes contract_features.h --
    ; which defaults the gate to 0 -- before the optimizer header.
    -D GALVOS_OPT_HAS_STATS=1
    -I include
    -I src
    -I test/test_optimizer/shims
    ; Counting-allocator shim for the allocFreeSymmetric invariant: routes
    ; every malloc()/free() in the linked objects through test/test_optimizer/
    ; alloc_probe.cpp. Without these the probe is inert and the invariant
    ; would report a false pass (the test asserts on that).
    -Wl,--wrap=malloc
    -Wl,--wrap=free
; Only compile the optimizer translation unit + its host shims, NOT the whole
; firmware. Keeps the host build free of ESP-IDF / Arduino dependencies.
build_src_filter =
    -<*>
    +<patterns/point_optimizer.cpp>
; If point_optimizer.cpp pulls in more .cpp at link time, add them here as
; +<patterns/xyz.cpp>. Prefer stubbing over pulling in firmware subsystems.
